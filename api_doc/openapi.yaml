  /favicon.svg:
    get:
      operationId: compat_favicon_svg_get
      tags:
      - Agent compatibility
      summary: Read gateway favicon
      description: Return the packaged SVG favicon, or a built-in SVG fallback. Both .svg and .ico aliases
        return image/svg+xml; this operation is intentionally excluded from the backend's default generated
        schema and added to this comprehensive specification.
      x-canonical-path: /favicon.svg
      x-aliases:
      - /favicon.ico
      x-included-by-documentation: true
      responses:
        '200':
          description: An SVG favicon, cached publicly for one day.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=86400
          content:
            image/svg+xml:
              schema:
                type: string
              example: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8"
                r="7" fill="#10b981"/></svg>
  /favicon.ico:
    get:
      operationId: compat_favicon_ico_get
      tags:
      - Agent compatibility
      summary: Read gateway favicon
      description: 'Return the packaged SVG favicon, or a built-in SVG fallback. Both .svg and .ico aliases
        return image/svg+xml; this operation is intentionally excluded from the backend''s default generated
        schema and added to this comprehensive specification.


        Alias of GET /favicon.svg.'
      x-canonical-path: /favicon.svg
      x-aliases:
      - /favicon.svg
      x-included-by-documentation: true
      responses:
        '200':
          description: An SVG favicon, cached publicly for one day.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=86400
          content:
            image/svg+xml:
              schema:
                type: string
              example: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8"
                r="7" fill="#10b981"/></svg>
components:
  schemas:
    AgentRegisterToolRequest:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
        endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
      type: object
      required:
      - name
      - description
      - parameters
      title: AgentRegisterToolRequest
      description: Request to register a custom tool/plugin.
    AgentRunRequest:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
        session_id:
          type: string
          minLength: 1
          title: Session Id
        max_steps:
          type: integer
          maximum: 15.0
          minimum: 1.0
          title: Max Steps
          default: 5
        tools:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tools
      additionalProperties: false
      type: object
      required:
      - prompt
      - session_id
      title: AgentRunRequest
      description: An agent run uses its session's configuration and saved memory.
      examples:
      - session_id: session-id
        prompt: Explain this calculation
        max_steps: 5
    AgentRunResponse:
      properties:
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        prompt:
          type: string
          title: Prompt
        steps:
          items:
            $ref: '#/components/schemas/AgentStep'
          type: array
          title: Steps
        final_answer:
          type: string
          title: Final Answer
        provider:
          type: string
          title: Provider
        model:
          type: string
          title: Model
        total_tokens:
          type: integer
          title: Total Tokens
        latency_ms:
          type: number
          title: Latency Ms
      type: object
      required:
      - prompt
      - steps
      - final_answer
      - provider
      - model
      - total_tokens
      - latency_ms
      title: AgentRunResponse
      description: Complete output of an agent run.
    AgentStep:
      properties:
