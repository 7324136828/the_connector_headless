      properties:
        name:
          title: Name
          description: Trimmed; name must match ^[a-z][a-z0-9_]{1,63}$ and must not collide with a reserved
            built-in tool name. Uppercase names are rejected.
          type: string
          maxLength: 64
          minLength: 2
        description:
          title: Description
          type: string
          maxLength: 2000
          minLength: 1
        parameters:
          title: Parameters
          description: 'Tool argument JSON Schema. The schema must declare type: object.'
          additionalProperties: true
          type: object
        python_code:
          title: Python Code
          description: Code for the selected skill type (field name is shared by Python, CMD, and C++).
            Also limited to 100000 UTF-8 bytes. Python must define top-level run(args); C++ must define
            main().
          type: string
          maxLength: 100000
          minLength: 1
        type:
          title: Type
          type: string
          enum:
          - python
          - cmd
          - c++
        source_conversation:
          title: Source Conversation
          description: Optional source conversation; also limited to 1000000 UTF-8 bytes.
          type: string
          maxLength: 1000000
      additionalProperties: false
      type: object
      title: SkillUpdate
      minProperties: 1
      description: At least one field must be supplied. Explicit null values are rejected.
    SpeechRequest:
      properties:
        content:
          type: string
          maxLength: 2097152
          minLength: 1
          title: Content
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
          description: Kokoro voice, such as af_heart or am_michael
      additionalProperties: false
      type: object
      required:
