        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ConnectorHTTPError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ConnectorValidationError:
      anyOf:
