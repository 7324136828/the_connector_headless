  /chat/completions:
    post:
      tags:
      - Agent compatibility
      summary: Create a structured chat completion
      operationId: compat_chat_completions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompatCompletionRequest'
            examples:
              text:
                summary: Plain completion
                value:
                  model: research-router
                  messages:
                  - role: user
                    content: Hello
              bufferedStream:
                summary: Buffered SSE with usage
                value:
                  model: research-router
                  messages:
                  - role: user
                    content: Hello
                  stream: true
                  stream_options:
                    include_usage: true
              functionTool:
                summary: Return a function call for the caller to execute
                value:
                  model: research-router
                  messages:
                  - role: user
                    content: Look it up
                  tools:
                  - &id002
                    type: function
                    function:
                      name: lookup
                      description: Look up an item
                      parameters:
                        type: object
                        properties:
                          query:
                            type: string
                        required:
                        - query
                        additionalProperties: false
