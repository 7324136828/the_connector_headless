  description: Validation examples and provider capabilities.
- name: Health
  description: Backend readiness and optional speech-service status.
- name: History exports
  description: ZIP exports and permanent chat-history deletion.
- name: Python environments
  description: Managed execution environments.
- name: Sessions
  description: Session configuration snapshots and persisted transcripts.
- name: Skills
  description: Typed callable skills, import, and export.
- name: Speech
  description: External Kokoro voices and WAV synthesis.
- name: configuration history
  description: configuration history endpoints.
- name: configurations
  description: configurations endpoints.
- name: plugins
  description: plugins endpoints.
- name: settings
  description: settings endpoints.
