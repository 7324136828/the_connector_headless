  /api/agent/run:
    post:
      summary: Run Agent
      description: Execute a ReAct reasoning/tool loop using the session's configuration, memory policy,
        and optional list of tools to advertise to the model. Omitted, null, or empty `tools` advertises
        all registered tools; unknown names in a supplied list are ignored. This list does not enforce
        execution permissions. The final exchange and tool trace are persisted. System sessions return
        the mock `message received` reply without model routing.
      operationId: run_agent_api_agent_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '400':
          description: Input exceeds a configured context/token limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
        '409':
          description: Session is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
        '502':
          description: Agent routing or execution failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
      tags:
      - Agents
  /api/agent/step:
    post:
      summary: Step Agent
      description: 'Execute one registered tool or webhook. Unknown tools and exceptions raised by a tool/webhook
        return HTTP 200 with `success: false` and an `error` string. Some handlers return execution errors
        in `result` even when `success` is true. `result` depends on the tool. `fetch_memory` requires
        a session ID in the request or tool arguments; a request-level session ID takes precedence.'
      operationId: step_agent_api_agent_step_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStepRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStepResponse'
        '422':
          description: Validation Error
          content:
