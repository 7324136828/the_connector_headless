openapi: 3.1.0
info:
  title: The Connector Headless API
  description: Comprehensive specification of the backend application routes in this repository. Includes
    session/chat/agent workflows, configuration libraries and history, typed skills, Python environments,
    plugins, storage settings, optional Kokoro speech, OpenAI-compatible completions, and discovery aliases.
    The backend does not enforce API authentication; an SDK's Authorization header is not validated by
    these routes. Configuration model IDs are distinct from upstream provider model names. Runtime-generated
    tool arguments and plugin proxy payloads intentionally have extensible schemas.
  version: 1.0.0
paths:
  /api/configs:
    get:
      tags:
      - configurations
      summary: List saved configurations
      operationId: list_configurations_api_configs_get
      parameters:
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Active Only
        description: Filter inactive saved configurations when true; false returns the entire library.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationRecord'
                title: Response List Configurations Api Configs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
      description: Return saved records ordered by creation timestamp and ID. Set active_only=true to
        include only active compatibility models.
    post:
      tags:
      - configurations
      summary: Create a saved configuration
      operationId: create_configuration_api_configs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationCreate'
            example:
              name: Local demo
              model_id: local-demo
              description: Deterministic local example.
              active: true
              context_length: null
              config:
                sequences:
                - provider: mock
                  model: mock-assistant
                  retries: 0
                system_prompt: You are a helpful, precise, and thoughtful AI assistant.
                past_memory: true
                context_window: 10
                memory_window: 20
                agent_final_retries: 5
                memory_scope: all_sessions
                memory_sources:
                  completion_events: true
                  system_sessions: true
                  user_sessions: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationRecord'
        '422':
          description: Invalid request fields or configuration semantics; detail is a validation-error
            array or a string.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/MgmtError'
                - $ref: '#/components/schemas/ConnectorValidationError'
        '409':
          description: The model_id is already assigned to another saved configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Model ID 'local-demo' already exists.
      description: Validate and normalize a complete routing snapshot, assign a UUID, persist the named
        compatibility model and remember the configuration in history. model_id must be unique; display
        names may repeat.
  /api/configs/{config_id}:
    get:
      tags:
      - configurations
      summary: Get a saved configuration
      operationId: get_configuration_api_configs__config_id__get
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: string
          title: Config Id
        description: Opaque UUID string assigned when the saved configuration is created.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: No saved record has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration not found.
      description: Return the complete saved record, including its normalized routing snapshot, for an
        opaque configuration ID.
    patch:
      tags:
      - configurations
      summary: Update a saved configuration
      operationId: update_configuration_api_configs__config_id__patch
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: string
          title: Config Id
        description: Opaque UUID string assigned when the saved configuration is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationUpdate'
            example:
              active: false
              description: Temporarily disabled.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationRecord'
        '422':
          description: Invalid update fields or complete configuration snapshot; detail is a validation-error
            array or a string.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/MgmtError'
                - $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: No saved record has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration not found.
      description: Update only the supplied library fields. model_id is immutable. Explicit null is allowed
        only for context_length. A supplied config replaces the complete snapshot, updates configuration
        history, and changes future routing through this model.
    delete:
      tags:
      - configurations
      summary: Delete a saved configuration
      operationId: delete_configuration_api_configs__config_id__delete
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: string
          title: Config Id
        description: Opaque UUID string assigned when the saved configuration is created.
      responses:
        '204':
          description: Configuration deleted; no response body.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: No saved record has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration not found.
      description: Remove a saved library record and its compatibility model. Previously remembered history
        snapshots are retained.
  /api/configs/{config_id}/download:
    get:
      tags:
      - configurations
      summary: Download config.json
      operationId: download_configuration_api_configs__config_id__download_get
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: string
          title: Config Id
        description: Opaque UUID string assigned when the saved configuration is created.
      responses:
        '200':
          description: config.json attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorConfiguration'
              example: &id001
                sequences:
                - provider: mock
                  model: mock-assistant
                  retries: 0
                system_prompt: You are a helpful, precise, and thoughtful AI assistant.
                past_memory: true
                context_window: 10
                memory_window: 20
                agent_final_retries: 5
                memory_scope: all_sessions
                memory_sources:
                  completion_events: true
                  system_sessions: true
                  user_sessions: true
          headers:
            Content-Disposition:
              description: Suggests config.json as the download filename.
              schema:
                type: string
                const: attachment; filename="config.json"
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: The requested record does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration not found.
      description: Download the stored routing snapshot as indented UTF-8 JSON with a trailing newline
        and an attachment filename of config.json. Library/history metadata is excluded.
  /api/configuration/detail/{configuration_name}:
    get:
      tags:
      - configurations
      summary: Get config.json by exact display name
      description: Return only the routing snapshot for an exact, case-sensitive saved display name, including
        inactive records. The path parameter can include slashes. Duplicate display names make the lookup
        ambiguous and produce HTTP 409.
      operationId: get_configuration_detail_api_configuration_detail__configuration_name__get
      parameters:
      - name: configuration_name
        in: path
        required: true
        schema:
          type: string
          title: Configuration Name
        description: Exact display name. URL-encode reserved characters; this is a greedy path parameter
          and may include slashes.
      responses:
        '200':
          description: Saved routing snapshot, without library metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorConfiguration'
              example: *id001
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: No saved record has this exact display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration not found.
        '409':
          description: More than one saved record has this display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Multiple saved configurations are named 'Local demo'.
  /api/config-history:
    get:
      tags:
      - configuration history
      summary: List configuration history
      operationId: list_configuration_history_api_config_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConfigurationHistoryRecord'
                type: array
                title: Response List Configuration History Api Config History Get
      description: Return immutable normalized configuration snapshots ordered by last_loaded_at descending,
        with most recently inserted rows first for timestamp ties. Identical normalized content is deduplicated
        across sessions, uploads, editor actions and library records.
    post:
      tags:
      - configuration history
      summary: Remember a configuration snapshot
      operationId: remember_configuration_api_config_history_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationHistoryCreate'
            example:
              config:
                sequences:
                - provider: mock
                  model: mock-assistant
                  retries: 0
                system_prompt: You are a helpful, precise, and thoughtful AI assistant.
                past_memory: true
                context_window: 10
                memory_window: 20
                agent_final_retries: 5
                memory_scope: all_sessions
                memory_sources:
                  completion_events: true
                  system_sessions: true
                  user_sessions: true
              name: config.json
              source: editor
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationHistoryRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
      description: Normalize and remember a successfully loaded config. New normalized content creates
        a UUID record; existing content increments load_count and updates timestamps while preserving
        the original name/source. Both cases return HTTP 201.
  /api/config-history/{history_id}:
    get:
      tags:
      - configuration history
      summary: Get configuration history entry
      operationId: get_configuration_history_api_config_history__history_id__get
      parameters:
      - name: history_id
        in: path
        required: true
        schema:
          type: string
          title: History Id
        description: Opaque UUID string assigned to deduplicated normalized configuration content.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationHistoryRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: No configuration history entry has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration history entry not found.
      description: Return one immutable routing snapshot and its accumulated successful-load metadata.
  /api/config-history/{history_id}/download:
    get:
      tags:
      - configuration history
      summary: Download historical config.json
      operationId: download_configuration_history_api_config_history__history_id__download_get
      parameters:
      - name: history_id
        in: path
        required: true
        schema:
          type: string
          title: History Id
        description: Opaque UUID string assigned to deduplicated normalized configuration content.
      responses:
        '200':
          description: config.json attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorConfiguration'
              example: *id001
          headers:
            Content-Disposition:
              description: Suggests config.json as the download filename.
              schema:
                type: string
                const: attachment; filename="config.json"
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: The requested record does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Configuration history entry not found.
      description: Download the stored routing snapshot as indented UTF-8 JSON with a trailing newline
        and an attachment filename of config.json. Library/history metadata is excluded.
  /models:
    get:
      tags:
      - Agent compatibility
      summary: List active configuration models
      operationId: compat_models_get
      responses:
        '200':
          description: Active configuration models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatModelList'
              example:
                object: list
                data:
                - id: research-router
                  object: model
                  created: 1767225600
                  owned_by: the_connector
                  name: Research routing
                  description: Example active mock configuration
                  configuration_id: 9c3da661-ab76-4b6d-b72b-b409b9558528
                  context_length: 32000
      description: 'Return an OpenAI-style model list containing only saved, active configurations. Inactive
        configurations and unsaved provider models are excluded. No active configurations yields data=[].
        Use configuration model_id values in completion requests; this is distinct from the provider catalog
        at /api/providers/models.


        Alias of GET /v1/models.'
      x-canonical-path: /v1/models
      x-aliases:
      - /v1/models
      - /api/v1/models
      - /api/models
