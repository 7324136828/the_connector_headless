          description: Host-side absolute folder path. Whitespace is trimmed; empty restores the temporary
            default. Environment-variable expansion and ~ are supported. Undefined variables, control
            characters, relative paths, or paths to existing non-directories are rejected. The folder
            need not exist yet.
      additionalProperties: false
      type: object
      required:
