            openai:
              type: boolean
            claude:
              type: boolean
            gemini:
              type: boolean
            openrouter:
              type: boolean
            ollama_host:
              type: string
            mock:
              type: boolean
          required:
          - openai
          - claude
          - gemini
          - openrouter
          - ollama_host
          - mock
          description: Provider booleans indicate configured API keys, not verified upstream connectivity.
        speech:
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/ConnectorSpeechHealth'
