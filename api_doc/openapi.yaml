      operationId: validate_routing_config_api_config_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorConfiguration'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorConfiguration'
        '422':
          description: Invalid configuration or request; normalization failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
      description: Validate and normalize an uploaded configuration without saving it. Apply defaults,
        canonicalize provider/token aliases, remove direct-step type markers, and normalize memory_scope
        to all_sessions. Per-provider/model effort support and positive weighted-route totals are checked
        at runtime.
