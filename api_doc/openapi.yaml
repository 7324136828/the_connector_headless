      additionalProperties: true
      required:
      - id
      - type
      - function
    CompatFunctionTool:
      type: object
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
              minLength: 1
            parameters:
              type: object
              additionalProperties: true
              description: A JSON Schema object describing the function arguments.
          additionalProperties: true
          description: Function names must be unique within tools. Additional provider options such as
            description and strict are retained; strict function schemas are unsupported by native Gemini
            and Ollama routes.
          required:
          - name
      additionalProperties: true
      required:
      - type
      - function
    CompatNamedToolChoice:
      type: object
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
              minLength: 1
          additionalProperties: true
          required:
          - name
      additionalProperties: true
      description: The name must match one of the supplied function tools.
      required:
      - type
      - function
    CompatResponseFormat:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
          - json_object
          - json_schema
        json_schema:
          type: object
          properties:
            schema:
              type: object
              additionalProperties: true
          additionalProperties: true
          required:
          - schema
      additionalProperties: true
      allOf:
      - if:
          properties:
            type:
              const: json_schema
          required:
          - type
        then:
          required:
          - json_schema
      description: Native Claude routes reject response_format. Other providers support these forms subject
        to provider capabilities.
      required:
      - type
    CompatStreamOptions:
      type: object
      properties:
        include_usage:
          type: boolean
          default: false
      additionalProperties: false
    CompatCompletionMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - system
          - developer
          - user
          - assistant
          - tool
        content:
          anyOf:
          - type: string
          - type: array
            items:
              type: object
              additionalProperties: true
          - type: 'null'
          description: 'Non-assistant messages require non-null content. Native Claude, Gemini, Ollama,
            and mock routes accept strings or an array consisting only of {type: text, text: string} parts.
            OpenAI/OpenRouter routes receive content parts unchanged.'
        tool_calls:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/CompatToolCall'
          - type: 'null'
        tool_call_id:
          type:
          - string
          - 'null'
          description: Required and nonempty for tool messages, and must reference a call in an earlier
            assistant message.
        name:
          type:
          - string
          - 'null'
      additionalProperties: true
      allOf:
      - if:
          properties:
            role:
              const: tool
          required:
          - role
        then:
          required:
          - tool_call_id
          properties:
            tool_call_id:
              type: string
              minLength: 1
      - if:
          properties:
            role:
              not:
                const: assistant
          required:
          - role
        then:
          required:
          - content
          properties:
            content:
              anyOf:
              - type: string
              - type: array
                items:
                  type: object
                  additionalProperties: true
            tool_calls:
              anyOf:
              - type: array
                maxItems: 0
              - type: 'null'
      - if:
          properties:
            role:
              const: assistant
          required:
          - role
        then:
          anyOf:
          - required:
            - content
            properties:
              content:
                anyOf:
                - type: string
                - type: array
                  items:
                    type: object
                    additionalProperties: true
          - required:
            - tool_calls
            properties:
              tool_calls:
                type: array
                minItems: 1
      description: Additional fields preserve provider reasoning and replay metadata. Only assistant messages
        may contain nonempty tool_calls. Assistant messages require non-null content or nonempty tool_calls;
        a refusal-only response cannot be replayed without satisfying that request constraint.
      required:
      - role
    CompatAssistantMessage:
      type: object
      properties:
        role:
          type: string
          const: assistant
        content:
          anyOf:
          - type: string
          - type: array
            items:
              type: object
              additionalProperties: true
          - type: 'null'
        tool_calls:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/CompatToolCall'
          - type: 'null'
        reasoning_content:
          type:
          - string
          - 'null'
        refusal:
          type:
          - string
          - 'null'
        extra_content:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: The assistant message, including provider-specific fields unchanged. Null content is
        valid for tool calls, refusals, and content_filter results; empty text is also valid. Preserve
        provider metadata when continuing a tool loop.
      required:
      - role
      - content
    CompatCompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
        prompt_tokens_details:
          description: Optional provider-specific token details, retained unchanged.
        completion_tokens_details:
          description: Optional provider-specific token details, retained unchanged.
      additionalProperties: false
      description: Provider counts when available; otherwise prompt and completion counts are estimated
        from serialized input and assistant output. A provider-supplied integer total_tokens is preserved.
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
    CompatCompletionResponse:
      type: object
      properties:
        id:
          type: string
          pattern: ^chatcmpl-[0-9a-f]{32}$
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Response creation time as Unix seconds.
        model:
          type: string
          description: The requested configuration model_id, rather than the underlying provider's returned
            model.
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              index:
                type: integer
                const: 0
              message:
                $ref: '#/components/schemas/CompatAssistantMessage'
              finish_reason:
                type: string
                description: Typically stop, length, tool_calls, or content_filter; upstream OpenAI/OpenRouter
                  reasons are preserved.
            additionalProperties: false
            required:
            - index
            - message
            - finish_reason
        usage:
          $ref: '#/components/schemas/CompatCompletionUsage'
      additionalProperties: false
      required:
      - id
      - object
      - created
      - model
      - choices
      - usage
    CompatCompletionDelta:
      type: object
      properties:
        role:
          type: string
          const: assistant
        content:
          type: string
        reasoning_content:
          type: string
        tool_calls:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/CompatToolCall'
            - type: object
              properties:
                index:
                  type: integer
                  minimum: 0
              required:
              - index
      additionalProperties: true
      description: Role, text, reasoning, tool calls, or provider metadata. An empty delta marks the terminal
        choice event. Tool-call payloads are emitted together rather than streamed argument fragments.
    CompatCompletionChunk:
      type: object
      properties:
        id:
          type: string
          pattern: ^chatcmpl-[0-9a-f]{32}$
        object:
          type: string
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: object
            properties:
              index:
                type: integer
                const: 0
              delta:
                $ref: '#/components/schemas/CompatCompletionDelta'
              finish_reason:
                type:
                - string
                - 'null'
            additionalProperties: false
            required:
            - index
            - delta
            - finish_reason
        usage:
          anyOf:
          - $ref: '#/components/schemas/CompatCompletionUsage'
          - type: 'null'
      additionalProperties: false
      description: 'The JSON payload after data: in an SSE event. With include_usage=true, choice chunks
        have usage=null, followed by a final usage chunk with choices=[]. Without include_usage, usage
        is absent. The final data: [DONE] marker is not JSON.'
      required:
      - id
      - object
      - created
      - model
      - choices
    CompatOllamaDetails:
      type: object
      properties:
        format:
          type: string
          const: configuration
        family:
          type: string
          const: connector
        families:
          type: array
          items:
            type: string
          const:
          - connector
        parameter_size:
          type: string
          const: ''
        quantization_level:
          type: string
          const: ''
      additionalProperties: false
      required:
      - format
      - family
      - families
      - parameter_size
      - quantization_level
    CompatOllamaModel:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        modified_at:
          type: string
          format: date-time
        size:
          type: integer
          minimum: 0
          description: Byte length of sorted-key JSON serialization of the routing configuration; this
            is not a model-weight file size.
        digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the serialized routing configuration.
        details:
          $ref: '#/components/schemas/CompatOllamaDetails'
      additionalProperties: false
      required:
      - name
      - model
      - modified_at
      - size
      - digest
      - details
    CompatOllamaModelList:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/CompatOllamaModel'
      additionalProperties: false
      required:
      - models
    CompatOllamaShowRequest:
      type: object
      additionalProperties: true
      properties:
        model: {}
        name: {}
      description: The server selects body.model when truthy, otherwise body.name; the selected value
        must be a nonempty string identifying an active configuration. model takes precedence over name.
        Extra fields such as verbose are accepted and ignored.
      examples:
      - model: research-router
      - name: research-router
    CompatOllamaShowResponse:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        details:
          $ref: '#/components/schemas/CompatOllamaDetails'
        model_info:
          type: object
          properties:
            general.architecture:
              type: string
              const: connector
            general.name:
              type: string
            connector.context_length:
              type: integer
              minimum: 1
          additionalProperties: false
          required:
          - general.architecture
          - general.name
        parameters:
          type: string
          description: num_ctx <context_length> when known, otherwise an empty string.
        capabilities:
          type: array
          items:
            type: string
          const:
          - completion
          - tools
        modified_at:
          type: string
          format: date-time
        template:
          type: string
          const: ''
        configuration_id:
          type: string
      additionalProperties: false
      required:
      - name
      - model
      - details
      - model_info
      - parameters
      - capabilities
      - modified_at
      - template
      - configuration_id
    CompatPropsResponse:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/CompatModel'
        default_generation_settings:
          type: object
          properties:
            model:
              type:
              - string
              - 'null'
              description: The sole selected model ID, or null when zero or multiple models are selected.
            n_ctx:
              type: integer
              minimum: 1
            params:
              type: object
              properties:
                n_ctx:
                  type: integer
                  minimum: 1
              additionalProperties: false
              required:
              - n_ctx
          additionalProperties: false
          description: n_ctx and params appear only if every selected configuration has a known context
            capacity; the minimum capacity is reported.
          required:
          - model
        model_path:
          type:
          - string
          - 'null'
        total_slots:
          type: integer
          const: 1
        chat_template:
          type: string
          const: ''
        streaming:
          type: string
          const: buffered
        tool_calling:
          type: boolean
          const: true
      additionalProperties: false
      required:
      - service
      - version
      - models
      - default_generation_settings
      - model_path
      - total_slots
      - chat_template
      - streaming
      - tool_calling
    CompatVersionResponse:
      type: object
      properties:
        version:
          type: string
        service:
          type: string
        api:
          type: string
          const: openai-compatible
      additionalProperties: false
      required:
      - version
      - service
      - api
    CompatRootResponse:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        status:
          type: string
          const: ok
        docs:
          type: string
          const: /docs
        configurations:
          type: string
          const: /api/configs
        models:
          type: string
          const: /v1/models
        chat_completions:
          type: string
          const: /v1/chat/completions
        active_configurations:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - service
      - version
      - status
      - docs
      - configurations
      - models
      - chat_completions
      - active_configurations
    CompatCompletionRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
          description: An active configuration model_id returned by GET /v1/models; an underlying provider
            model name is accepted only when saved as that configuration model_id.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CompatCompletionMessage'
        stream:
          type: boolean
          default: false
          description: When true, return buffered SSE after the entire upstream completion has finished.
        stream_options:
          anyOf:
          - $ref: '#/components/schemas/CompatStreamOptions'
          - type: 'null'
        tools:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/CompatFunctionTool'
          - type: 'null'
          description: Function definitions only. Names must be unique; the gateway returns calls to the
            caller and never executes them locally.
        tool_choice:
          anyOf:
          - type: string
            enum:
            - auto
            - none
            - required
          - $ref: '#/components/schemas/CompatNamedToolChoice'
          - type: 'null'
          description: Defaults to auto when tools are present and none otherwise. required needs at least
            one tool; a named choice must reference a supplied tool.
        parallel_tool_calls:
          type:
          - boolean
          - 'null'
          description: Native Gemini and Ollama cannot guarantee false with enabled tools; such routes
            are skipped as unsupported.
        temperature:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 2
        top_p:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        max_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
        max_completion_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
        stop:
          anyOf:
          - type: string
            minLength: 1
          - type: array
            minItems: 1
            maxItems: 4
            items:
              type: string
              minLength: 1
          - type: 'null'
        response_format:
          anyOf:
          - $ref: '#/components/schemas/CompatResponseFormat'
          - type: 'null'
        seed:
          type:
          - integer
          - 'null'
        reasoning_effort:
          type:
          - string
          - 'null'
          description: Accepted for client compatibility. The configured route's reasoning effort is authoritative
            and takes precedence over this value.
        frequency_penalty:
          type:
          - number
          - 'null'
          minimum: -2
          maximum: 2
        presence_penalty:
          type:
          - number
          - 'null'
          minimum: -2
          maximum: 2
        n:
          type: integer
          const: 1
          default: 1
        user:
          type:
          - string
          - 'null'
          description: Accepted but not forwarded to completion providers.
        metadata:
          anyOf:
          - type: object
            additionalProperties:
              type: string
          - type: 'null'
          description: Accepted but not forwarded to completion providers.
        store:
          type: boolean
          const: false
          default: false
          description: Only false is accepted. This field is not forwarded and does not disable the server's
            own completion-response archive.
      additionalProperties: false
      allOf:
      - not:
          required:
          - max_tokens
          - max_completion_tokens
          properties:
            max_tokens:
              type: integer
            max_completion_tokens:
              type: integer
      description: Only declared top-level fields are accepted. Choose at most one non-null token-limit
        field. Tools must have unique names and tool results must reference an earlier assistant call.
        Provider-specific constraints may cause explicit configured fallbacks or an unsupported_option
        error. Numeric options must be finite.
      required:
      - model
      - messages
servers:
- url: http://127.0.0.1:8301
  description: Local backend (project default port).
security: []
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
tags:
- name: Agent compatibility
  description: Agent compatibility endpoints.
