        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '404':
          description: Saved configuration or configuration-history entry not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
        '409':
