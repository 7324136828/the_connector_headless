  /api/settings:
    get:
      tags:
      - settings
      summary: Get storage settings
      operationId: get_settings_api_settings_get
      responses:
        '200':
          description: Running storage paths and saved directory preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtStorageSettings'
        '500':
          description: The settings file cannot be read or written, or saved JSON is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: 'Could not save settings: permission denied'
      description: Read the saved storage preference and compare it with the running backend's directory.
        Invalid saved directory preferences are reported with configuration_error when the backend remains
        running under an override.
    patch:
      tags:
      - settings
      summary: Save storage directory preference
      operationId: update_settings_api_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsUpdate'
            example:
              data_dir: ''
        required: true
      responses:
        '200':
          description: Running storage paths and saved directory preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtStorageSettings'
        '422':
          description: Invalid request body or host-side directory preference; detail is a validation-error
            array or a string.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/MgmtError'
                - $ref: '#/components/schemas/ConnectorValidationError'
        '500':
          description: The settings file cannot be read or written, or saved JSON is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: 'Could not save settings: permission denied'
      description: Validate and atomically save data_dir while preserving other settings. The storage
        services adopt the directory only after restart; the returned data_dir remains the currently running
        directory and restart_required indicates whether the preference differs. This endpoint does not
        change the service port.
  /api/health:
    get:
      summary: Health Check
      description: Return API readiness and configured-provider indicators. Kokoro speech is optional
        in headless mode; unavailable speech is reported in the payload while this endpoint still returns
        HTTP 200. Provider indicators do not contact the providers.
      operationId: health_check_api_health_get
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHealth'
      tags:
      - Health
  /api/speech:
    post:
      summary: Create Speech
      description: 'Synthesize plain text or a serialized JSON object with a nonempty `text` string. Valid
        JSON arrays/scalars, missing `text`, and empty text are rejected. Voice precedence: request `actor`,
        then JSON content `actor`, then the configured default. JSON `actor`, when non-null, must be a
        nonempty string. Returns WAV audio; speech requires an available external Kokoro service.'
      operationId: create_speech_api_speech_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
        required: true
      responses:
        '200':
          description: WAV audio synthesized by the external Kokoro service.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
          headers:
            X-Audio-Duration:
              description: Generated audio duration in seconds. Forwarded only when supplied by Kokoro.
              schema:
                type: string
            X-Render-Seconds:
              description: Rendering time in seconds. Forwarded only when supplied by Kokoro.
              schema:
                type: string
            X-Real-Time-Factor:
              description: Rendering time divided by audio duration. Forwarded only when supplied by Kokoro.
              schema:
                type: string
        '422':
          description: Invalid request, unknown voice, or response content without speakable text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '502':
          description: Kokoro rejected the request or returned invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
        '503':
          description: The configured Kokoro service is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorHTTPError'
      tags:
      - Speech
