  /models/{model_id}:
    get:
      tags:
      - Agent compatibility
      summary: Retrieve an active configuration model
      operationId: compat_models_model_id_get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
        description: An active configuration model_id from the model list.
        example: research-router
      responses:
        '200':
          description: The requested active configuration model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatModel'
              example:
                id: research-router
                object: model
                created: 1767225600
                owned_by: the_connector
                name: Research routing
                description: Example active mock configuration
                configuration_id: 9c3da661-ab76-4b6d-b72b-b409b9558528
                context_length: 32000
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: No active configuration has the requested model_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatErrorResponse'
              example:
                error:
                  message: Active configuration model 'missing' not found. Save and activate a configuration
                    in /api/configs, then use its model_id.
                  type: invalid_request_error
                  param: model
                  code: model_not_found
      description: 'Look up an active saved configuration by its model_id. Missing, inactive, or deleted
        configurations return an OpenAI error envelope.


        Alias of GET /v1/models/{model_id}.'
      x-canonical-path: /v1/models/{model_id}
      x-aliases:
      - /v1/models/{model_id}
      - /api/v1/models/{model_id}
      - /api/models/{model_id}
