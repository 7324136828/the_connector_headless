  /api/plugins/install:
    post:
      tags:
      - plugins
      summary: Install a plugin ZIP
      operationId: install_plugin_api_plugins_install_post
      responses:
        '201':
          description: Plugin installed, initially disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtPluginRecord'
        '400':
          description: Invalid ZIP, archive layout, extraction limits, or manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Invalid plugin ZIP or manifest
        '409':
          description: This ID is already installed or its managed folder already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Plugin is already installed; uninstall it before installing another version
        '413':
          description: The raw ZIP exceeds 10 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Plugin ZIP exceeds 10 MiB
      description: Send the ZIP as the raw HTTP request body. The server streams at most 10 MiB and validates
        up to 1000 entries and 50 MiB extracted data. The archive root must contain instruction.md, plugin.json,
        ui/package.json, backend/pyproject.toml, run.bat and run.sh. Unsafe paths, hidden files, duplicate
        entries, symlinks, encrypted/corrupt files, unsupported permissions and invalid manifests are
        rejected. Installation persists the plugin in disabled state; enable it separately. No Content-Type
        check is performed; application/zip is recommended.
      requestBody:
        required: true
        description: Raw ZIP bytes, maximum 10 MiB. Empty input is rejected as an invalid archive. This
          endpoint does not accept a multipart file field.
        content:
          application/zip:
            schema:
              type: string
              format: binary
              x-max-size-bytes: 10485760
          application/octet-stream:
            schema:
              type: string
              format: binary
