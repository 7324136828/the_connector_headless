        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '400':
          description: Gateway plugin validation error, or a plugin-defined upstream HTTP 400 response.
          content:
            application/json:
              schema: {}
              example:
