        required: true
        schema:
          type: string
          title: Asset Path
        description: Greedy safe relative asset path, including ui/ prefix; for example ui/src/index.js.
      - name: Range
        in: header
        required: false
        description: Optional byte range(s) for a partial asset response.
        schema:
          type: string
        example: bytes=0-1023
      - name: If-Range
        in: header
        required: false
        description: ETag or Last-Modified value; a mismatch sends the complete asset.
        schema:
          type: string
      responses:
        '200':
          description: Plugin UI asset. Actual Content-Type depends on the file; */* represents other
            inferred media types.
          content:
            text/javascript:
              schema:
                type: string
            text/html:
              schema:
                type: string
            '*/*':
              schema:
                type: string
                format: binary
          headers:
            Access-Control-Allow-Origin:
              description: 'Normally *; null when the sandbox-origin middleware handles Origin: null.'
              schema:
                type: string
              example: '*'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Plugin asset/proxy responses are not cached.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorValidationError'
        '206':
          description: Partial asset content for a satisfiable byte Range request; multipart ranges may
            use multipart/byteranges.
          content:
            '*/*':
              schema:
                type: string
                format: binary
          headers:
            Access-Control-Allow-Origin:
              description: 'Normally *; null when the sandbox-origin middleware handles Origin: null.'
              schema:
                type: string
              example: '*'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Plugin asset/proxy responses are not cached.
            Content-Range:
              schema:
                type: string
              description: Byte interval and complete size for a single range.
        '416':
          description: Asset byte range cannot be satisfied; the response body is empty.
          headers:
            Content-Range:
              schema:
                type: string
              example: bytes */1024
        '400':
          description: Unsafe asset path, or malformed byte Range request (the latter is text/plain).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Unsafe ZIP path
            text/plain:
              schema:
                type: string
        '404':
          description: Plugin or UI asset not found; non-UI files cannot be served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: UI asset not found
        '409':
          description: The plugin is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtError'
              example:
                detail: Enable the plugin before opening its UI
      description: Serve an existing safe file under the installed plugin's ui/ directory. asset_path
        is a greedy path and must start with ui/. Only running plugins can serve assets. JavaScript uses
        text/javascript; other media types are inferred from the filename, with arbitrary binary content
        possible. FileResponse supports byte Range and If-Range requests and emits ETag and Last-Modified
        metadata; it does not perform If-None-Match/If-Modified-Since conditional GET handling.
  /api/plugins/{plugin_id}/frame:
