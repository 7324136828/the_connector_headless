                detail: Enable the plugin before using it
            '*/*':
              schema:
                type: string
                format: binary
        '413':
          description: Gateway request exceeds 10 MiB, or an upstream HTTP 413 response.
          content:
            application/json:
              schema: {}
              example:
                detail: Plugin request exceeds 10 MiB
            '*/*':
              schema:
                type: string
                format: binary
        '502':
          description: Connection/timeout/upstream HTTP transport failed, or an upstream HTTP 502 response.
          content:
            application/json:
              schema: {}
              example:
                detail: Plugin backend is unavailable
            '*/*':
              schema:
                type: string
                format: binary
        default:
          description: Any other upstream HTTP status, including redirects and plugin-defined errors.
            Content and status are passed through; upstream headers other than Content-Type are discarded.
          content:
            application/json:
              schema: {}
