      description: Portable skill definitions; database IDs and timestamps are omitted.
    ConnectorModelCapabilitiesRequest:
      type: object
      additionalProperties:
        type: string
      properties:
        provider:
          type: string
          description: Provider name; absent defaults to an empty string.
        model:
          type: string
          description: Provider model name; absent defaults to an empty string.
    ConnectorModelCapabilities:
      type: object
      properties:
        effort_levels:
          type: array
          items:
            type: string
        default_effort:
          type:
          - string
          - 'null'
      required:
      - effort_levels
      - default_effort
    MgmtError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
      description: FastAPI HTTPException JSON error emitted by management handlers. Validation errors
        instead use HTTPValidationError.
    MgmtDirectRoute:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      properties:
        provider:
          type: string
          description: 'Provider, compared after stripping whitespace and lowercasing. Canonical values:
            openai, claude, gemini, openrouter, ollama, mock. Legacy aliases anthropic, google, and demo
            normalize to claude, gemini, and mock respectively. Unknown providers are rejected.'
          x-normalized-enum:
          - openai
          - claude
          - gemini
          - openrouter
          - ollama
          - mock
          examples:
          - openai
          - mock
          - anthropic
        model:
          type: string
          minLength: 1
          description: Nonblank provider model ID. Leading/trailing whitespace is removed.
          examples:
          - mock-assistant
          - gpt-5-nano
        effort:
          type:
          - string
          - 'null'
          enum:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
          - null
          description: Provider/model-dependent reasoning effort. OpenAI and OpenRouter accept all seven
            strings shown; missing/null OpenAI effort becomes minimal, and missing/null OpenRouter effort
            remains unspecified. Claude opus-4-5 and sonnet-4-6 accept low/medium/high; opus-4-6 additionally
            accepts max. Gemini 2.5 flash/flash-lite accept none/low/medium/high; 2.5 pro accepts low/medium/high.
            Ollama gpt-oss accepts low/medium/high. For those model-specific controls, missing/null selects
            the first supported level. Other models must omit effort or set null, and normalization removes
            it. Dated Claude/OpenAI-style model suffixes are stripped by the effort registry. Upstream
            providers may impose additional model-specific restrictions.
        retries:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
          description: Retry count after the initial route attempt.
        max_input_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Positive finite token cap. Omitted or null means unspecified and is removed during
            normalization.
        max_output_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Positive finite token cap. Omitted or null means unspecified and is removed during
            normalization.
        max_input_token:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Legacy alias for max_input_tokens; removed during normalization. If both non-null
            forms occur, their values must match.
        max_output_token:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Legacy alias for max_output_tokens; removed during normalization. If both non-null
            forms occur, their values must match.
        type:
          type:
          - string
          - 'null'
          enum:
          - direct
          - null
      title: Direct routing step
      description: Attempt this route in sequence. The optional type discriminator is removed from normalized
        direct steps.
    MgmtProbabilityChoice:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      properties:
        provider:
          type: string
          description: 'Provider, compared after stripping whitespace and lowercasing. Canonical values:
            openai, claude, gemini, openrouter, ollama, mock. Legacy aliases anthropic, google, and demo
            normalize to claude, gemini, and mock respectively. Unknown providers are rejected.'
          x-normalized-enum:
          - openai
          - claude
          - gemini
          - openrouter
          - ollama
          - mock
          examples:
          - openai
          - mock
          - anthropic
        model:
          type: string
          minLength: 1
          description: Nonblank provider model ID. Leading/trailing whitespace is removed.
          examples:
          - mock-assistant
          - gpt-5-nano
        effort:
          type:
          - string
          - 'null'
          enum:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
          - null
          description: Provider/model-dependent reasoning effort. OpenAI and OpenRouter accept all seven
            strings shown; missing/null OpenAI effort becomes minimal, and missing/null OpenRouter effort
            remains unspecified. Claude opus-4-5 and sonnet-4-6 accept low/medium/high; opus-4-6 additionally
            accepts max. Gemini 2.5 flash/flash-lite accept none/low/medium/high; 2.5 pro accepts low/medium/high.
            Ollama gpt-oss accepts low/medium/high. For those model-specific controls, missing/null selects
            the first supported level. Other models must omit effort or set null, and normalization removes
            it. Dated Claude/OpenAI-style model suffixes are stripped by the effort registry. Upstream
            providers may impose additional model-specific restrictions.
        retries:
          type: integer
          minimum: 0
          maximum: 5
          description: Retry count; defaults to the enclosing probability step's retries.
        max_input_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Positive finite token cap. Omitted or null means unspecified and is removed during
            normalization.
        max_output_tokens:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Positive finite token cap. Omitted or null means unspecified and is removed during
            normalization.
        max_input_token:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Legacy alias for max_input_tokens; removed during normalization. If both non-null
            forms occur, their values must match.
        max_output_token:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Legacy alias for max_output_tokens; removed during normalization. If both non-null
            forms occur, their values must match.
        probability:
          type: number
          minimum: 0
          maximum: 1000000
          default: 1
          description: Finite nonnegative relative weight; weights need not sum to one. Zero excludes
            the choice.
      title: Weighted routing choice
      description: A candidate in a probability routing step. A choice has no type field.
    MgmtProbabilityStep:
      type: object
      additionalProperties: false
      required:
      - type
      - choices
      description: Choose a route by relative weight. At least one choice must have positive weight (an
        omitted probability defaults to 1).
      properties:
        type:
          type: string
          const: probability
        choices:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/MgmtProbabilityChoice'
          contains:
            anyOf:
            - required:
              - probability
              properties:
                probability:
                  type: number
                  exclusiveMinimum: 0
            - not:
                required:
                - probability
          minContains: 1
        retries:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
          description: Default retry count for choices that omit their own retries.
    MgmtMemorySources:
      type: object
      additionalProperties: false
      description: Every omitted source flag is filled with true during normalization.
      properties:
        user_sessions:
          type: boolean
          default: true
          description: Include messages from user sessions.
        system_sessions:
          type: boolean
          default: true
          description: Include messages from system/API sessions.
        completion_events:
          type: boolean
          default: true
          description: Include compatibility completion events.
    ConnectorConfiguration:
      title: Connector config.json
      type: object
      additionalProperties: false
      required:
      - sequences
      description: Complete routing snapshot accepted by the configuration normalizer. Defaults are materialized
        when saved or loaded; the caller must supply sequences. Unknown fields are rejected at every configuration/route
        level. Direct step type markers and singular route token-cap aliases are removed, provider/model
        values are normalized, and absent/null token caps are removed. A configuration update replaces
        this entire snapshot rather than merging individual fields. Provider/model effort compatibility
        and equality of duplicate token-cap aliases are additional semantic checks described on the route
        fields. JSON Schema defaults document server behavior; client-side validators need not materialize
        them.
      properties:
        sequences:
          type: array
          minItems: 1
          maxItems: 30
          description: Ordered routing steps, each a direct route or a weighted probability step.
          items:
            oneOf:
            - $ref: '#/components/schemas/MgmtDirectRoute'
            - $ref: '#/components/schemas/MgmtProbabilityStep'
        system_prompt:
          type: string
          maxLength: 100000
          default: You are a helpful, precise, and thoughtful AI assistant.
        past_memory:
          type: boolean
          default: true
        context_window:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
          description: Conversation context window setting (independent of provider token caps).
        memory_window:
          type: integer
          minimum: 0
          maximum: 200
          default: 20
        agent_final_retries:
          type: integer
          minimum: 0
          maximum: 15
          default: 5
          description: Maximum final-response retries for an agent run.
        memory_scope:
          type: string
          enum:
          - all_sessions
          - session
          default: all_sessions
          description: Legacy session is accepted for compatibility; every saved/loaded value normalizes
            to all_sessions because memory is shared across conversations.
        memory_sources:
          $ref: '#/components/schemas/MgmtMemorySources'
          default: {}
        gross_max_input_token:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Total input-token cap across the routing operation. Omitted/null is unspecified.
        gross_max_output_token:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000000
          description: Total output-token cap across the routing operation. Omitted/null is unspecified.
      examples:
      - sequences:
        - provider: mock
          model: mock-assistant
          retries: 0
        system_prompt: You are a helpful, precise, and thoughtful AI assistant.
        past_memory: true
        context_window: 10
        memory_window: 20
        agent_final_retries: 5
        memory_scope: all_sessions
        memory_sources:
          completion_events: true
          system_sessions: true
          user_sessions: true
      - sequences:
        - type: probability
          retries: 1
          choices:
          - provider: openai
            model: gpt-5-nano
            effort: minimal
            probability: 3
          - provider: mock
            model: mock-assistant
            probability: 1
    MgmtPluginManifest:
      type: object
      additionalProperties: true
      required:
      - id
      - version
      - backend
      - ui
      - webhook
      description: The installed plugin.json manifest. Additional manifest metadata is preserved and returned.
        Tool parameter schemas are supplied by each plugin.
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        version:
          type: string
          minLength: 1
          maxLength: 64
        backend:
          type: object
          additionalProperties: true
          required:
          - language
          - path
          - entry
          properties:
            language:
              type: string
              const: python
            path:
              type: string
              const: backend
            entry:
              type: string
              description: Python module:function invoked to start the supervised backend.
              examples:
              - count_message.server:main
        ui:
          type: object
          additionalProperties: true
          required:
          - entry
          properties:
            entry:
              type: string
              description: Existing browser-ready .js module under ui/.
              examples:
              - ui/src/index.js
        webhook:
          type: object
          additionalProperties: true
          required:
          - method
          - path
          properties:
            method:
              type: string
              const: POST
            path:
              type: string
              pattern: ^/[A-Za-z0-9_/-]+$
              examples:
              - /api/count_message
        permissions:
          type: array
          maxItems: 1
          items:
            type: string
            const: connector-database:read
          default: []
          description: Optional read-only connector database permission.
        tool:
          type: object
          additionalProperties: true
          properties:
            description:
              description: Plugin-supplied description used to register its agent tool.
            parameters:
              type: object
              additionalProperties: true
              description: Plugin-defined JSON Schema for tool arguments; defaults to an unconstrained
                object.
    MgmtPluginRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - enabled
      - status
      - error
      - manifest
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        version:
          type: string
        enabled:
          type: boolean
          description: Persisted enablement intent; may remain true when the supervised backend has failed.
        status:
          type: string
          enum:
          - running
          - error
          - disabled
        error:
          type:
          - string
          - 'null'
          description: Most recent startup/runtime diagnostic, or null.
        manifest:
          $ref: '#/components/schemas/MgmtPluginManifest'
    MgmtPluginUninstalled:
      type: object
      additionalProperties: false
      required:
      - status
      - id
      properties:
        status:
          type: string
          const: uninstalled
        id:
          type: string
    MgmtStorageSettings:
      type: object
      additionalProperties: false
      required:
      - data_dir
      - configured_data_dir
      - default_data_dir
      - settings_path
      - restart_required
      properties:
        data_dir:
          type: string
          description: Absolute data directory currently used by the running backend.
        configured_data_dir:
          type: string
          description: Saved user preference. Empty means use the default temporary directory.
        default_data_dir:
          type: string
          description: Host temporary directory plus the_connector.
        settings_path:
          type: string
          description: Absolute host path of the persisted settings JSON.
        restart_required:
          type: boolean
          description: True when the requested resolved directory differs from the running service's directory,
            or the saved preference is invalid.
        configuration_error:
          type: string
          description: Present only when a saved data-directory preference cannot be resolved; the preference
            is returned for repair.
    CompatErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              enum:
              - invalid_request_error
              - server_error
            param:
              type:
              - string
              - 'null'
            code:
              type: string
              enum:
              - invalid_request_error
              - model_not_found
              - unsupported_option
              - context_length_exceeded
              - upstream_error
              - empty_completion
          additionalProperties: false
          required:
          - message
          - type
          - param
          - code
      additionalProperties: false
      required:
      - error
    CompatModel:
      type: object
      properties:
        id:
          type: string
          description: The active configuration's model_id, used in completion requests.
        object:
          type: string
          const: model
        created:
          type: integer
          description: Configuration creation time as Unix seconds.
        owned_by:
          type: string
          const: the_connector
        name:
          type: string
        description:
          type: string
        configuration_id:
          type: string
        context_length:
          type: integer
          minimum: 1
          description: Declared context capacity, or the minimum known capacity across all configured
            routes. Omitted when any route has unknown capacity.
      additionalProperties: false
      required:
      - id
      - object
      - created
      - owned_by
      - name
      - description
      - configuration_id
    CompatModelList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompatModel'
      additionalProperties: false
      required:
      - object
      - data
    CompatToolCall:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
              description: Serialized JSON arguments. Native Claude, Gemini, and Ollama routes require
